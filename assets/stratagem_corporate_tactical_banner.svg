<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">STRATAGEM — Intelligence Strategy Execution</title>
<desc id="desc">Animated corporate tactical banner for Stratagem.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101c"/><stop offset=".55" stop-color="#0c1725"/><stop offset="1" stop-color="#050b13"/></linearGradient>
<linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#4cc9f0"/><stop offset=".5" stop-color="#9beaff"/><stop offset="1" stop-color="#4cc9f0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8fb3cc" stroke-opacity=".07"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="1600" height="520" rx="22"/></clipPath>
</defs>
<rect width="1600" height="520" rx="22" fill="url(#bg)"/>
<rect width="1600" height="520" rx="22" fill="url(#grid)"/>
<g clip-path="url(#clip)" fill="none">
<path d="M-80 430L380-30M1160 590L1690 60" stroke="#4cc9f0" stroke-opacity=".09" stroke-width="2"/>
<circle cx="1320" cy="260" r="185" stroke="#7ee8ff" stroke-opacity=".06"/><circle cx="1320" cy="260" r="125" stroke="#7ee8ff" stroke-opacity=".08"/><circle cx="1320" cy="260" r="62" stroke="#7ee8ff" stroke-opacity=".1"/>
<path d="M1320 50v40M1320 430v40M1110 260h40M1490 260h40" stroke="#7ee8ff" stroke-opacity=".35"/>
<rect x="-260" width="240" height="520" fill="url(#cyan)" opacity=".035"><animate attributeName="x" from="-260" to="1620" dur="5.5s" repeatCount="indefinite"/></rect>
<line x1="0" y1="86" x2="1600" y2="86" stroke="#7ee8ff" stroke-opacity=".13"><animate attributeName="y1" values="86;434;86" dur="7s" repeatCount="indefinite"/><animate attributeName="y2" values="86;434;86" dur="7s" repeatCount="indefinite"/></line>
</g>
<g transform="translate(105 260)" fill="none" filter="url(#glow)"><path d="M0-72V-25M0 25V72M-72 0H-25M25 0H72" stroke="#7ee8ff" stroke-width="3"/><circle r="47" stroke="#4cc9f0" stroke-width="2"/><circle r="10" stroke="#fff" stroke-width="2"/><circle r="3" fill="#7ee8ff" stroke="none"><animate attributeName="r" values="3;7;3" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle></g>
<g transform="translate(215 170)">
<text x="0" y="95" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="700" letter-spacing="15" fill="#f4f8fb">STRATAGEM</text>
<rect x="3" y="124" width="690" height="2" fill="url(#cyan)"><animate attributeName="width" values="80;690;80" dur="4.5s" repeatCount="indefinite"/></rect>
<text x="4" y="163" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" letter-spacing="7" fill="#9fb7c8">INTELLIGENCE • STRATEGY • EXECUTION</text>
</g>
<g transform="translate(1195 90)" font-family="monospace" fill="#7ee8ff">
<text y="0" font-size="12" opacity=".65">STRATAGEM / SYSTEM STATUS</text><text y="28" font-size="11" opacity=".45">SIGNAL</text><rect x="65" y="19" width="120" height="5" rx="2" fill="#7ee8ff" opacity=".12"/><rect x="65" y="19" width="93" height="5" rx="2" fill="#7ee8ff" opacity=".65"><animate attributeName="width" values="72;108;93;116;93" dur="3.2s" repeatCount="indefinite"/></rect>
<text y="58" font-size="11" opacity=".45">ANALYSIS</text><rect x="65" y="49" width="120" height="5" rx="2" fill="#7ee8ff" opacity=".12"/><rect x="65" y="49" width="108" height="5" rx="2" fill="#7ee8ff" opacity=".65"><animate attributeName="width" values="108;82;114;108" dur="2.7s" repeatCount="indefinite"/></rect>
<text y="88" font-size="11" opacity=".45">READINESS</text><text x="74" y="88" font-size="11" font-weight="700">OPERATIONAL</text></g>
<g fill="none" stroke="#7ee8ff" stroke-opacity=".55" stroke-width="2"><path d="M34 34h71M34 34v71M1495 34h71v71M34 415v71h71M1495 486h71v-71"/></g>
<circle cx="1528" cy="465" r="5" fill="#7ee8ff"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/><animate attributeName="r" values="5;8;5" dur="1.4s" repeatCount="indefinite"/></circle>
</svg>
