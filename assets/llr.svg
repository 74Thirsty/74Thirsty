<svg id="llr-hero" width="1200" height="600" viewBox="0 0 1200 600"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    /* Colors */
    .bg { fill: #000000; }
    .orange { fill: #ff7a00; }
    .white-text { fill: #ffffff; }

    /* Wheelchair enters from left */
    @keyframes wheelchair-in {
      0%   { transform: translate(-300px, 300px); opacity: 0; }
      40%  { transform: translate(150px, 300px); opacity: 1; }
      60%  { transform: translate(150px, 300px); opacity: 1; }
      100% { transform: translate(-400px, 300px); opacity: 0; }
    }

    /* Title slams in from right (knocks wheelchair) */
    @keyframes title-slam {
      0%   { transform: translate(1200px, 150px); opacity: 0; }
      40%  { transform: translate(350px, 150px); opacity: 1; }
      60%  { transform: translate(350px, 150px); opacity: 1; }
      100% { transform: translate(350px, 80px); opacity: 1; }
    }

    /* Motorcycle drives in under title */
    @keyframes moto-in {
      0%   { transform: translate(1200px, 360px); opacity: 0; }
      60%  { transform: translate(1200px, 360px); opacity: 0; }
      100% { transform: translate(380px, 360px); opacity: 1; }
    }

    /* Bottom copy fades/materializes */
    @keyframes bottom-copy {
      0%   { opacity: 0; transform: translate(0, 40px); }
      70%  { opacity: 0; transform: translate(0, 40px); }
      100% { opacity: 1; transform: translate(0, 0); }
    }

    /* Apply animations */
    #wheelchair-group {
      animation: wheelchair-in 4s ease-out forwards;
      transform-box: fill-box;
      transform-origin: center;
    }

    #title-group {
      animation: title-slam 4s cubic-bezier(0.2, 0.8, 0.2, 1.2) forwards;
      transform-box: fill-box;
      transform-origin: center;
    }

    #moto-group {
      animation: moto-in 4s ease-out forwards;
      transform-box: fill-box;
      transform-origin: center;
    }

    #bottom-copy {
      animation: bottom-copy 4s ease-out forwards;
    }

    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="600" />

  <!-- Wheelchair (simple icon placeholder) -->
  <g id="wheelchair-group">
    <circle cx="80" cy="380" r="40" fill="#ffffff" />
    <circle cx="150" cy="380" r="30" fill="#ffffff" />
    <rect x="90" y="320" width="60" height="20" fill="#ffffff" />
    <rect x="110" y="280" width="20" height="40" fill="#ffffff" />
    <line x1="110" y1="300" x2="80" y2="360" stroke="#ffffff" stroke-width="6" />
  </g>

  <!-- Title: LOST LIMB RIDERS -->
  <g id="title-group">
    <rect x="0" y="120" width="800" height="120" class="orange" />
    <text x="50" y="190" class="white-text" font-size="72" font-weight="900">
      LOST LIMB RIDERS
    </text>
  </g>

  <!-- Motorcycle (simple silhouette placeholder) -->
  <g id="moto-group">
    <!-- Wheels -->
    <circle cx="450" cy="420" r="40" fill="#ffffff" />
    <circle cx="580" cy="420" r="40" fill="#ffffff" />
    <!-- Frame -->
    <rect x="460" y="380" width="90" height="20" fill="#ffffff" />
    <polygon points="460,380 520,340 580,360 550,380" fill="#ffffff" />
    <!-- Handlebar -->
    <line x1="520" y1="340" x2="560" y2="310" stroke="#ffffff" stroke-width="6" />
  </g>

  <!-- Bottom copy -->
  <g id="bottom-copy">
    <text x="50" y="500" class="white-text" font-size="26" font-weight="600">
      BUILDING A COMMUNITY WITH OUTREACH AND ADVOCACY FOR AMPUTEES.
    </text>
    <text x="50" y="540" class="orange" font-size="30" font-weight="900">
      RIDE BEYOND LIMITS.
    </text>
  </g>

</svg>
