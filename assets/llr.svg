<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700"
     width="1200"
     height="700">

  <defs>
    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Speed gradient -->
    <linearGradient id="energy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00eaff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00eaff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9f7ff"/>
      <stop offset="30%" stop-color="#78909c"/>
      <stop offset="55%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#0b0f12"/>
    </linearGradient>

    <!-- Wheelchair symbol -->
    <g id="wheelchair">
      <!-- large rear wheel -->
      <circle cx="300" cy="455" r="105"
              fill="none"
              stroke="url(#metal)"
              stroke-width="20"/>

      <circle cx="300" cy="455" r="8" fill="#00eaff"/>

      <!-- frame -->
      <path d="M300 455
               L365 330
               L500 330
               L565 455"
            fill="none"
            stroke="url(#metal)"
            stroke-width="22"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <!-- seat -->
      <path d="M360 330 L500 330"
            stroke="#d7e4ea"
            stroke-width="28"
            stroke-linecap="round"/>

      <!-- back -->
      <path d="M365 330 L345 235"
            stroke="#d7e4ea"
            stroke-width="22"
            stroke-linecap="round"/>

      <!-- back support -->
      <path d="M345 235 L430 235"
            stroke="#d7e4ea"
            stroke-width="18"
            stroke-linecap="round"/>

      <!-- front caster -->
      <circle cx="565" cy="470" r="34"
              fill="none"
              stroke="#78909c"
              stroke-width="12"/>

      <!-- arm -->
      <path d="M365 300 L455 300"
            stroke="#00eaff"
            stroke-width="12"
            stroke-linecap="round"/>

      <!-- energy core -->
      <circle cx="430" cy="390" r="18"
              fill="#00eaff"
              filter="url(#glow)"/>
    </g>

    <!-- Motorcycle -->
    <g id="motorcycle">

      <!-- wheels -->
      <circle cx="360" cy="475" r="92"
              fill="none"
              stroke="#101820"
              stroke-width="25"/>

      <circle cx="830" cy="475" r="92"
              fill="none"
              stroke="#101820"
              stroke-width="25"/>

      <!-- tire glow -->
      <circle cx="360" cy="475" r="92"
              fill="none"
              stroke="#00eaff"
              stroke-width="5"
              opacity=".8"
              filter="url(#glow)"/>

      <circle cx="830" cy="475" r="92"
              fill="none"
              stroke="#00eaff"
              stroke-width="5"
              opacity=".8"
              filter="url(#glow)"/>

      <!-- chassis -->
      <path d="M360 475
               L490 350
               L650 350
               L830 475
               L690 475
               L585 390
               L490 475 Z"
            fill="url(#metal)"
            stroke="#c7d8df"
            stroke-width="6"
            stroke-linejoin="round"/>

      <!-- fuel tank -->
      <path d="M490 350
               Q535 285 625 315
               L680 350
               L620 395
               L525 390 Z"
            fill="#172027"
            stroke="#00eaff"
            stroke-width="7"/>

      <!-- engine -->
      <path d="M530 395
               L650 395
               L690 470
               L500 470 Z"
            fill="#263238"
            stroke="#607d8b"
            stroke-width="7"/>

      <!-- engine highlights -->
      <path d="M545 420 L640 420
               M535 445 L655 445"
            stroke="#00eaff"
            stroke-width="5"
            opacity=".8"/>

      <!-- front fork -->
      <path d="M680 350 L830 475"
            stroke="#c7d8df"
            stroke-width="14"/>

      <path d="M705 330 L830 475"
            stroke="#607d8b"
            stroke-width="10"/>

      <!-- handlebars -->
      <path d="M675 350
               L710 305
               L775 305"
            fill="none"
            stroke="#d7e4ea"
            stroke-width="12"
            stroke-linecap="round"/>

      <!-- seat -->
      <path d="M500 330
               Q585 285 680 330"
            fill="none"
            stroke="#05080a"
            stroke-width="32"
            stroke-linecap="round"/>

      <!-- exhaust -->
      <path d="M520 455
               Q430 505 300 500"
            fill="none"
            stroke="#78909c"
            stroke-width="18"
            stroke-linecap="round"/>

      <!-- headlight -->
      <path d="M760 335 L810 350 L785 380 L745 365 Z"
            fill="#ffffff"
            stroke="#00eaff"
            stroke-width="5"
            filter="url(#glow)"/>

      <!-- rider -->
      <circle cx="605" cy="210" r="42"
              fill="#111820"
              stroke="#00eaff"
              stroke-width="7"/>

      <path d="M585 250
               Q650 245 705 320
               L675 350
               L610 295
               L550 350
               L510 325
               Q535 270 585 250 Z"
            fill="#111820"
            stroke="#c7d8df"
            stroke-width="7"/>

      <!-- arm -->
      <path d="M655 275 L715 315"
            fill="none"
            stroke="#c7d8df"
            stroke-width="16"
            stroke-linecap="round"/>

      <!-- leg -->
      <path d="M610 295 L570 390"
            fill="none"
            stroke="#c7d8df"
            stroke-width="18"
            stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#05080b"/>

  <!-- Atmospheric glow -->
  <ellipse cx="600" cy="390"
           rx="500" ry="230"
           fill="#00eaff"
           opacity=".035"
           filter="url(#strongGlow)"/>

  <!-- SPEED LINES -->
  <g stroke="url(#energy)" stroke-linecap="round">

    <path d="M70 160 H360" stroke-width="5">
      <animate attributeName="x1"
               values="70;500;70"
               dur="1.8s"
               repeatCount="indefinite"/>
      <animate attributeName="x2"
               values="360;790;360"
               dur="1.8s"
               repeatCount="indefinite"/>
    </path>

    <path d="M10 220 H300" stroke-width="3">
      <animate attributeName="x1"
               values="10;450;10"
               dur="1.3s"
               repeatCount="indefinite"/>
      <animate attributeName="x2"
               values="300;740;300"
               dur="1.3s"
               repeatCount="indefinite"/>
    </path>

    <path d="M100 550 H400" stroke-width="6">
      <animate attributeName="x1"
               values="100;550;100"
               dur="1.5s"
               repeatCount="indefinite"/>
      <animate attributeName="x2"
               values="400;850;400"
               dur="1.5s"
               repeatCount="indefinite"/>
    </path>

  </g>

  <!-- WHEELCHAIR -->
  <g id="chair"
     opacity="1"
     transform="translate(0 0)">

    <use href="#wheelchair"/>

    <!-- Chair pulses before transformation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 8 0; 0 0"
      dur=".45s"
      begin="0s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="1;1;1;0"
      dur="8s"
      repeatCount="indefinite"/>
  </g>

  <!-- ENERGY BURST -->
  <g fill="none"
     stroke="#00eaff"
     stroke-linecap="round"
     filter="url(#glow)">

    <path d="M350 450 Q600 300 850 450"
          stroke-width="6"
          stroke-dasharray="20 35">

      <animate
        attributeName="stroke-dashoffset"
        values="0;-220"
        dur="1s"
        repeatCount="indefinite"/>
    </path>

    <path d="M250 380 Q600 200 950 380"
          stroke-width="3"
          stroke-dasharray="12 45">

      <animate
        attributeName="stroke-dashoffset"
        values="0;-200"
        dur=".8s"
        repeatCount="indefinite"/>
    </path>

  </g>

  <!-- TRANSFORMATION PARTICLES -->
  <g fill="#00eaff" filter="url(#glow)">
    <circle cx="450" cy="350" r="6">
      <animate attributeName="cx" values="450;650;450" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="350;270;350" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="500" cy="430" r="5">
      <animate attributeName="cx" values="500;720;500" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="430;390;430" dur="1.7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="380" cy="300" r="4">
      <animate attributeName="cx" values="380;600;380" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;500;300" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- MOTORCYCLE -->
  <g opacity="0">

    <use href="#motorcycle"/>

    <!-- Dramatic reveal -->
    <animate
      attributeName="opacity"
      values="0;0;1;1;1;0"
      dur="8s"
      repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="900 0;900 0;0 0;0 0;-900 0;-900 0"
      dur="8s"
      repeatCount="indefinite"/>

  </g>

  <!-- Final energy flash -->
  <circle cx="600" cy="390" r="20"
          fill="#ffffff"
          opacity="0"
          filter="url(#strongGlow)">

    <animate
      attributeName="r"
      values="20;500;20"
      dur="8s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0;0;0.8;0;0"
      dur="8s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Ground -->
  <path d="M100 570 H1100"
        stroke="#00eaff"
        stroke-width="2"
        opacity=".3"/>

  <!-- TITLE -->
  <text x="600"
        y="635"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="46"
        font-weight="900"
        letter-spacing="8"
        fill="#ffffff">
    LOST LIMB RIDERS
  </text>

  <text x="600"
        y="670"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        letter-spacing="5"
        fill="#00eaff">
    RIDE BEYOND LIMITS
  </text>

</svg>
